name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check
      - run: npm run build
      # The example consumes the library source, so a broken public API fails here too.
      - run: npm install
        working-directory: example
      - run: npm run build
        working-directory: example
