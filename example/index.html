<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-magneto — drag-and-drop sticker board for React</title>
    <meta
      name="description"
      content="Interactive playground for react-magneto: a drag-and-drop fridge-magnet sticker board for React. Headless, zero dependencies, render-free dragging, and layout export/import."
    />
    <link rel="canonical" href="https://guitarwag.github.io/react-magneto/" />

    <!-- Social cards. og:image needs an absolute URL, so it is not base-relative. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="react-magneto" />
    <meta property="og:title" content="react-magneto — drag-and-drop sticker board for React" />
    <meta
      property="og:description"
      content="Drag the stickers, restack and rotate them, and watch the exported layout update live. Headless, zero dependencies, render-free dragging."
    />
    <meta property="og:url" content="https://guitarwag.github.io/react-magneto/" />
    <meta property="og:image" content="https://guitarwag.github.io/react-magneto/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The react-magneto playground: tech logo stickers scattered across a dark board."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="react-magneto — drag-and-drop sticker board for React" />
    <meta
      name="twitter:description"
      content="Drag the stickers, restack and rotate them, and watch the exported layout update live."
    />
    <meta name="twitter:image" content="https://guitarwag.github.io/react-magneto/og.png" />

    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #0f172a;
        -webkit-font-smoothing: antialiased;
      }
      /* Keep the page from ever scrolling sideways on small screens. */
      body {
        overflow-x: hidden;
      }
      code,
      pre {
        margin: 0;
      }
      /* The board is wide on desktop and tall on phones, so 16 magnets have room either way. */
      .board {
        aspect-ratio: 16 / 8;
      }
      @media (max-width: 720px) {
        .board {
          aspect-ratio: 3 / 4;
        }
      }
      a:focus-visible,
      button:focus-visible,
      pre:focus-visible {
        outline: 2px solid #22c55e;
        outline-offset: 2px;
      }
      /* Honour the OS setting: no intro springs, no transitions. */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
